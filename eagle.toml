# eagle_eye 渠道注册表。新增渠道见 AGENTS.md「新增渠道」。
# 相对路径一律相对本文件所在目录（仓库根目录）。可用环境变量 EAGLE_CONFIG 指向别的配置文件。

# 进程内 Python 渠道：class = "模块:类"（继承 eagle_eye.core.Channel）
[channels.x]
type = "python"
class = "eagle_eye.channels.x.adapter:XChannel"
enabled = true
default = true

# 外部渠道：JSON-over-stdio，协议见 docs/channel-protocol.md
[channels.xhs]
type = "external"
# 子进程 cwd = backends/xhs，-config 用相对 cwd 的 config.yaml（不含 "/"，核心不做路径转换，无歧义）
command = ["bin/eagle-xhs", "channel", "-config", "config.yaml"]
cwd = "backends/xhs"
timeout_seconds = 900
describe_timeout_seconds = 30
native_command = ["bin/eagle-xhs"]   # eagle xhs login 等原样透传（cwd 同上，默认读 config.yaml）
enabled = true
default = false   # 慢、有封号风险：不带 -c 的 eagle search 不搜它，必须显式 -c xhs
# 以下仅在二进制不可用时供 eagle channels 展示
title = "小红书"
description = "搜索小红书笔记（真实浏览器、拟人节奏）"
cost_hint = "慢：单次搜索约 1–3 分钟（真实浏览器拟人节奏）；有封号风险，按需使用；风控后会返回 cooldown，浏览器占用时返回 busy"
