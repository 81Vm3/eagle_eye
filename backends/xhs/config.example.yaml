# 复制为 config.yaml 后修改：cp config.example.yaml config.yaml
# 下面的相对路径（db_path / user_data_dir）都相对本配置文件所在目录。

db_path: data/xhs.db        # 冷却、节流时刻等跨进程状态

browser:
  # channel search 只接管已在运行的 Chrome（最像真人，风控风险最低），必须配置 cdp_url。
  # 先用 --remote-debugging-port=9222 --user-data-dir=<某目录> 启动 Chrome 并登录小红书，然后填：
  # cdp_url: http://127.0.0.1:9222
  cdp_url: ""
  # cdp_url 连不上时自动执行的启动命令（WSL 中启动 Windows Chrome 的例子）：
  # cdp_launch:
  #   - /mnt/c/Program Files/Google/Chrome/Application/chrome.exe
  #   - --remote-debugging-port=9222
  #   - --user-data-dir=C:\Users\<你的用户名>\xhs-chrome
  #   - --no-first-run
  #   - --disable-features=CalculateNativeWinOcclusion   # 窗口被挡住时页面仍算可见（最小化不行）
  #   - --disable-backgrounding-occluded-windows
  # 不填 cdp_url 时 login 由程序启动 Chrome；chrome_path 为空则自动查找本机 Chrome，找不到会下载 Chromium
  chrome_path: ""
  user_data_dir: data/chrome-profile   # 程序自行启动 Chrome 时的登录态目录，务必固定
  headless: false                      # 强烈建议保持 false，无头模式更容易被识别
  silent: false                        # 静默运行：窗口移到屏幕外，你看不到但照常工作（需要 cdp_launch 里的遮挡检测参数）；login 时不生效
  proxy: ""

behavior:
  read_seconds: [5, 15]          # detail 打开的每篇笔记的阅读停留
  action_delay_ms: [600, 2200]   # 相邻操作之间的停顿
  cooldown_hours: 6              # 触发验证码后的冷却时间（连续触发会翻倍，上限 48h；一次完整成功的搜索后清零）
  nav_interval_seconds: [8, 15]  # 相邻两次页面加载至少间隔这么久（随机，跨进程生效）
  nav_per_minute: 3              # 每分钟最多加载几个页面（-1 不限）。这是速度与风险之间最主要的旋钮

# 作为 eagle_eye 渠道（eagle-xhs channel search）时的参数。
channel:
  timeout_seconds: 600          # 单次搜索总时限，应小于 eagle.toml 里的 timeout_seconds
  max_scrolls: 5                # 搜索结果页最多向下滚动几次（每次约多 20 条）
