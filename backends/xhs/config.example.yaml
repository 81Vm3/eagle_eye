# 推荐用 eagle-xhs init -config config.yaml 生成适合本平台的配置（已存在不覆盖）；
# 也可以复制本文件后修改：cp config.example.yaml config.yaml
# 下面的相对路径（db_path / user_data_dir）都相对本配置文件所在目录。

db_path: data/xhs.db        # 风控冷却等跨进程状态

browser:
  # true（默认，推荐）：channel search 自己用专用 profile（user_data_dir）启动无头 Chrome（--headless=new），
  #   不弹窗口、用完关闭；不需要 eagle-xhs browser，也不需要 cdp_url。UA 里的 HeadlessChrome 会换成同版本的 Chrome。
  # false：接管 cdp_url 上已在运行的有界面专用 Chrome（eagle-xhs browser 启动它），新开一个标签页工作。
  # 不写本字段时：配置了 cdp_url 的旧配置按 false 处理（保持原来接管 Chrome 的用法），否则按 true。
  # login 总是打开有界面的 Chrome 扫码，登录态保存在专用 profile 里（无头搜索用同一个 profile，两者不能同时运行）。
  headless: true
  user_data_dir: data/chrome-profile   # 专用 profile（登录态），务必固定，不要指向你日常 Chrome 的目录
  # 程序自行启动 Chrome（无头搜索 / login）时用的浏览器；为空自动查找本机 Chrome（找不到时报错，不自动下载）
  chrome_path: ""

  # ---- 以下只在 headless: false 或调试（eagle-xhs browser）时使用 ----
  # cdp_url: http://127.0.0.1:9222
  cdp_url: ""
  # cdp_url 连不上时自动执行的启动命令（可执行文件 + 参数，每项一个参数，不经过 shell）。
  # --user-data-dir 必须是绝对路径、且不是你日常 Chrome 的目录；init 生成的配置指向本目录下 data/chrome-profile。
  # 下面三个 --disable-* 关掉窗口被遮挡/在后台时的降级和计时器节流（所有平台都建议带上）。
  #
  # macOS：
  # cdp_launch:
  #   - /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
  #   - --remote-debugging-port=9222
  #   - --user-data-dir=/Users/<用户名>/Library/Application Support/eagle_eye/xhs/data/chrome-profile
  #   - --no-first-run
  #   - --disable-backgrounding-occluded-windows
  #   - --disable-renderer-backgrounding
  #   - --disable-background-timer-throttling
  #
  # Linux：第一项换成 google-chrome（或 chromium），--user-data-dir=/home/<用户名>/.config/eagle_eye/xhs/data/chrome-profile
  #
  # Windows（路径含反斜杠，用 YAML 单引号，反斜杠原样保留）：
  #   - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  #   - '--user-data-dir=C:\Users\<用户名>\AppData\Roaming\eagle_eye\xhs\data\chrome-profile'
  #   其余同上，并额外加 --disable-features=CalculateNativeWinOcclusion（静默模式必需）
  silent: false                        # 静默运行（仅 headless: false）：窗口移到屏幕外（需要上面的遮挡检测参数；只在 Windows 上验证过）；login 时不生效
  proxy: ""

behavior:
  cooldown_hours: 6              # 触发验证码后的冷却时间（连续触发会翻倍，上限 48h；一次完整成功的搜索后清零）

# 作为 eagle_eye 渠道（eagle-xhs channel search）时的参数。
channel:
  timeout_seconds: 120          # 单次搜索总时限，应小于 eagle.toml 里的 timeout_seconds
  max_scrolls: 5                # 搜索结果页最多向下滚动几次（每次约多 20 条）
  detail_concurrency: 3         # detail 时最多同时打开几个笔记标签页（1–10）
