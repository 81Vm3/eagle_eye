# Python + Go 单测（不访问 X / 小红书），并检查 wheel 内容。release.yml 由 ee-xhs 维护。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backends/xhs/go.mod
          cache-dependency-path: backends/xhs/go.sum

      - uses: astral-sh/setup-uv@v6

      - name: 安装 Python 依赖（twscrape）
        run: python -m pip install twscrape

      - name: Python 单测
        run: make test-py PY=python

      - name: Go 单测
        run: make test-go GO="$(command -v go)"

      - name: 构建 wheel 并检查内容
        run: |
          uv build --wheel -o dist
          python - <<'PY'
          import glob, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          need = [
              "eagle_eye/defaults/eagle.toml",
              "eagle_eye/_bundled/extensions/x-cookie/manifest.json",
              "eagle_eye/_bundled/skills/eagle-search/SKILL.md",
              "eagle_eye/channels/x/topics/.gitkeep",
          ]
          missing = [n for n in need if n not in names]
          assert not missing, f"wheel 缺少: {missing}"
          print("wheel 内容 OK")
          PY

      - name: 安装后冒烟（临时 EAGLE_HOME，不访问网络）
        run: |
          export EAGLE_HOME="$RUNNER_TEMP/eagle_home"
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/eagle" channels
          "$RUNNER_TEMP/venv/bin/eagle" x extension
          "$RUNNER_TEMP/venv/bin/eagle" skill install --target "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/eagle-search/SKILL.md"
          "$RUNNER_TEMP/venv/bin/eagle" setup --check || true   # 未下载 eagle-xhs，体检应报 ✗ 但不崩溃
